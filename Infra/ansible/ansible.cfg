[defaults]
inventory           = inventory/hosts.yml
remote_user         = ubuntu
private_key_file    = ~/.ssh/portfolio-key.pem
host_key_checking   = False
retry_files_enabled = False
stdout_callback     = default
result_format       = yaml
timeout             = 30
pipelining          = True
forks               = 10

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
