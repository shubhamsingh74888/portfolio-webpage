---
# ── CREATE NAMESPACE ──────────────────────────────
- name: Create ArgoCD namespace
  become_user: ubuntu
  command: kubectl create namespace argocd
  register: ns_result
  failed_when:
    - ns_result.rc != 0
    - "'already exists' not in ns_result.stderr"
  changed_when: "'already exists' not in ns_result.stderr"

# ── INSTALL ARGOCD (server-side apply fixes K8s 1.34 annotation limit) ──
- name: Install ArgoCD
  become_user: ubuntu
  command: >
    kubectl apply -n argocd
    --server-side
    --force-conflicts
    -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  register: argocd_install
  changed_when: "'created' in argocd_install.stdout or 'configured' in argocd_install.stdout"

# ── WAIT FOR ARGOCD PODS ──────────────────────────
- name: Wait for ArgoCD server pod to be ready
  become_user: ubuntu
  command: >
    kubectl wait --for=condition=ready pod
    -l app.kubernetes.io/name=argocd-server
    -n argocd
    --timeout=300s
  register: argocd_wait
  changed_when: false
  retries: 3
  delay: 30

# ── EXPOSE ARGOCD AS NODEPORT ─────────────────────
- name: Patch ArgoCD service to NodePort
  become_user: ubuntu
  command: >
    kubectl patch svc argocd-server -n argocd
    -p '{"spec":{"type":"NodePort"}}'
  register: patch_result
  changed_when: "'configured' in patch_result.stdout"

# ── GET INITIAL PASSWORD ──────────────────────────
- name: Get ArgoCD initial admin password
  become_user: ubuntu
  shell: >
    kubectl -n argocd get secret argocd-initial-admin-secret
    -o jsonpath="{.data.password}" | base64 -d
  register: argocd_password
  changed_when: false
  no_log: true

- name: Print ArgoCD password
  debug:
    msg: "ArgoCD admin password: {{ argocd_password.stdout }}"

# ── GET ARGOCD NODEPORT ───────────────────────────
- name: Get ArgoCD NodePort
  become_user: ubuntu
  shell: >
    kubectl get svc argocd-server -n argocd
    -o jsonpath='{.spec.ports[?(@.name=="https")].nodePort}'
  register: argocd_port
  changed_when: false

- name: Print ArgoCD URL
  debug:
    msg: "ArgoCD URL: https://{{ ansible_host }}:{{ argocd_port.stdout }}"

# ── CONFIGURE ARGOCD APP FOR PORTFOLIO ───────────
- name: Create ArgoCD Application for portfolio
  become_user: ubuntu
  shell: |
    kubectl apply -n argocd -f - <<YAML
    apiVersion: argoproj.io/v1alpha1
    kind: Application
    metadata:
      name: portfolio
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/shubhamsingh74888/portfolio-webpage
        targetRevision: main
        path: kubernetes
      destination:
        server: https://kubernetes.default.svc
        namespace: portfolio
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
    YAML
  register: argocd_app
  changed_when: "'created' in argocd_app.stdout or 'configured' in argocd_app.stdout"

- name: Print ArgoCD App status
  debug:
    msg: "ArgoCD portfolio app created — will auto-sync from GitHub"
