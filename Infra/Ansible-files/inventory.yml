all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/instance1-key
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

  children:
    jenkins:
      hosts:
        jenkins-server:
          ansible_host: 3.109.5.34

    k8s_master:
      hosts:
        master-node:
          ansible_host: 13.206.146.241
          ansible_env:
            KUBECONFIG: /home/ubuntu/.kube/config

    k8s_workers:
      hosts:
        worker-node-1:
          ansible_host: 13.235.2.70
